$schema: 'https://moonrepo.dev/schemas/toolchain.json'

proto:
  version: '0.55.4'

javascript:
  dedupeOnLockfileChange: false
  inferTasksFromScripts: true
  packageManager: 'pnpm'
  syncPackageManagerField: true

bun:
  version: '1.3.11'

node:
  version: '22.20.0'

pnpm:
  version: '10.15.1'
  installArgs:
    - '--frozen-lockfile'

rust:
  version: '1.94.0'
