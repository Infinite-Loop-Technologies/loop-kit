[package]
name = "forge-desktop"
version = "0.1.0"
description = "Forge desktop shell for the loop-kit monorepo."
authors = ["Infinite Loop Technologies"]
edition = "2021"

[lib]
name = "forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
