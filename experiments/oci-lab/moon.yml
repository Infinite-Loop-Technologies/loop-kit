$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
tags:
  - 'experiment'
  - 'oci'
  - 'rust'
  - 'wasm'

fileGroups:
  sources:
    - 'src/**/*'
    - 'tests/**/*'
    - 'Cargo.toml'
    - 'Cargo.lock'

tasks:
  check:
    command: 'cargo'
    args:
      - 'check'
      - '--locked'
      - '--all-targets'
    inputs:
      - '@group(sources)'

  typecheck:
    command: 'cargo'
    args:
      - 'check'
      - '--locked'
      - '--all-targets'
    inputs:
      - '@group(sources)'

  build:
    command: 'cargo'
    args:
      - 'build'
      - '--locked'
    inputs:
      - '@group(sources)'

  test:
    command: 'cargo'
    args:
      - 'test'
      - '--locked'
    deps:
      - 'oci-lab:build'
    inputs:
      - '@group(sources)'

  test-e2e:
    command: 'cargo'
    args:
      - 'test'
      - '--locked'
      - '--test'
      - 'e2e_registry'
    deps:
      - 'oci-lab:build'
    inputs:
      - '@group(sources)'

  clean:
    command: 'cargo'
    args:
      - 'clean'
