[package]
name = "oci-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bytes = "1.10.1"
clap = { version = "4.6.0", features = ["derive"] }
docker_credential = "1.3.2"
oci-client = "0.16.1"
tokio = { version = "1.47.1", features = ["fs", "macros", "process", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
wasmtime = "40.0.4"
wat = "1.245.1"
