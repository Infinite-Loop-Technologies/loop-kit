asyncapi: '2.6.0'
info:
  title: Forge Control Plane Realtime API
  version: '0.1.0'
  description: Future WebSocket event contract for Forge run, billing, and quota updates.
defaultContentType: application/json
servers:
  controlPlane:
    url: api.forge.invalid/v0/ws
    protocol: wss
    description: Placeholder WebSocket server for Forge control-plane subscriptions.
channels:
  organizations/{organizationId}/runs/{runId}/status.updated:
    parameters:
      organizationId:
        $ref: '#/components/parameters/organizationId'
      runId:
        $ref: '#/components/parameters/runId'
    subscribe:
      operationId: receiveRunStatusUpdated
      message:
        $ref: '#/components/messages/RunStatusUpdated'
  organizations/{organizationId}/runs/{runId}/log.appended:
    parameters:
      organizationId:
        $ref: '#/components/parameters/organizationId'
      runId:
        $ref: '#/components/parameters/runId'
    subscribe:
      operationId: receiveRunLogAppended
      message:
        $ref: '#/components/messages/RunLogAppended'
  organizations/{organizationId}/runs/{runId}/artifact.created:
    parameters:
      organizationId:
        $ref: '#/components/parameters/organizationId'
      runId:
        $ref: '#/components/parameters/runId'
    subscribe:
      operationId: receiveRunArtifactCreated
      message:
        $ref: '#/components/messages/RunArtifactCreated'
  organizations/{organizationId}/billing/state.updated:
    parameters:
      organizationId:
        $ref: '#/components/parameters/organizationId'
    subscribe:
      operationId: receiveBillingStateUpdated
      message:
        $ref: '#/components/messages/BillingStateUpdated'
  organizations/{organizationId}/quota.updated:
    parameters:
      organizationId:
        $ref: '#/components/parameters/organizationId'
    subscribe:
      operationId: receiveQuotaUpdated
      message:
        $ref: '#/components/messages/QuotaUpdated'
components:
  parameters:
    organizationId:
      description: Forge organization identifier.
      schema:
        type: string
        format: uuid
    runId:
      description: Agent run identifier.
      schema:
        type: string
        format: uuid
  messages:
    RunStatusUpdated:
      name: run.status.updated
      title: Run status updated
      payload:
        $ref: '#/components/schemas/RunStatusUpdatedPayload'
    RunLogAppended:
      name: run.log.appended
      title: Run log appended
      payload:
        $ref: '#/components/schemas/RunLogAppendedPayload'
    RunArtifactCreated:
      name: run.artifact.created
      title: Run artifact created
      payload:
        $ref: '#/components/schemas/RunArtifactCreatedPayload'
    BillingStateUpdated:
      name: billing.state.updated
      title: Billing state updated
      payload:
        $ref: '#/components/schemas/BillingStateUpdatedPayload'
    QuotaUpdated:
      name: quota.updated
      title: Quota updated
      payload:
        $ref: '#/components/schemas/QuotaUpdatedPayload'
  schemas:
    RunStatus:
      type: string
      enum: [queued, running, completed, failed, canceled, cancel_requested]
    BillingState:
      type: string
      enum: [inactive, trialing, active, past_due, canceled]
    RunStatusUpdatedPayload:
      type: object
      additionalProperties: false
      required: [organizationId, runId, status, occurredAt]
      properties:
        organizationId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunStatus'
        occurredAt:
          type: string
          format: date-time
    RunLogAppendedPayload:
      type: object
      additionalProperties: false
      required: [organizationId, runId, index, level, message, occurredAt]
      properties:
        organizationId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        index:
          type: integer
          minimum: 0
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        occurredAt:
          type: string
          format: date-time
    RunArtifactCreatedPayload:
      type: object
      additionalProperties: false
      required: [organizationId, runId, artifactId, kind, name, contentType, occurredAt]
      properties:
        organizationId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        artifactId:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        contentType:
          type: string
        url:
          type: string
          format: uri
        occurredAt:
          type: string
          format: date-time
    BillingStateUpdatedPayload:
      type: object
      additionalProperties: false
      required: [organizationId, state, entitlements, occurredAt]
      properties:
        organizationId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/BillingState'
        planKey:
          type: string
        sourceEventId:
          type: string
        entitlements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, granted]
            properties:
              key:
                type: string
              granted:
                type: boolean
              reason:
                type: string
        occurredAt:
          type: string
          format: date-time
    QuotaUpdatedPayload:
      type: object
      additionalProperties: false
      required:
        [organizationId, periodStart, periodEnd, runsUsed, tokensUsed, enforcementState, occurredAt]
      properties:
        organizationId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        runsUsed:
          type: integer
          minimum: 0
        runsLimit:
          type: integer
          minimum: 0
        tokensUsed:
          type: integer
          minimum: 0
        tokensLimit:
          type: integer
          minimum: 0
        enforcementState:
          type: string
          enum: [ok, nearing_limit, blocked]
        occurredAt:
          type: string
          format: date-time
