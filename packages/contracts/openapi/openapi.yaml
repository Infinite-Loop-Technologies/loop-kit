openapi: 3.1.0
info:
  title: Forge Control Plane API
  version: 0.1.0
  summary: Forge control-plane REST contract for session bootstrap, org management, billing, usage, and agent runs.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.forge.invalid
    description: Placeholder production server
tags:
  - name: session
    description: Authenticated session bootstrap and initial actor context.
  - name: organizations
    description: Forge organization listing, creation, and detail retrieval.
  - name: billing
    description: Billing projection reads derived from Polar customer state.
  - name: usage
    description: Quota and current-period usage summary reads.
  - name: runs
    description: Agent run enqueue, listing, detail, and cancellation operations.
security:
  - bearerAuth: []
paths:
  /v0/session/bootstrap:
    get:
      operationId: getSessionBootstrap
      tags: [session]
      summary: Resolve the authenticated actor and initial Forge org context.
      responses:
        '200':
          description: Session bootstrap payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBootstrap'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v0/organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List Forge organizations visible to the authenticated actor.
      responses:
        '200':
          description: Visible organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create a Forge organization through the WorkOS boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
  /v0/organizations/{organizationId}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Fetch the Forge view of a single organization.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organization detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /v0/organizations/{organizationId}/billing-summary:
    get:
      operationId: getBillingSummary
      tags: [billing]
      summary: Read the current billing projection for an organization.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Billing projection summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /v0/organizations/{organizationId}/usage-summary:
    get:
      operationId: getUsageSummary
      tags: [usage]
      summary: Read the current usage and quota state for an organization.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Usage projection summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /v0/organizations/{organizationId}/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List agent runs for an organization.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/RunStatus'
      responses:
        '200':
          description: Run list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      operationId: createRun
      tags: [runs]
      summary: Enqueue a new agent run.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '202':
          description: Run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /v0/organizations/{organizationId}/runs/{runId}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Fetch a single agent run, including log and artifact summaries.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
  /v0/organizations/{organizationId}/runs/{runId}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Request cancellation for a queued or running agent run.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/RunId'
      responses:
        '202':
          description: Cancellation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  parameters:
    OrganizationId:
      in: path
      name: organizationId
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: uuid
  responses:
    UnauthorizedError:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: The actor is not allowed to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: The request body or query string is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Bearer
  schemas:
    Role:
      type: string
      enum: [owner, admin, member, viewer]
    BillingState:
      type: string
      enum: [inactive, trialing, active, past_due, canceled]
    UsageEnforcementState:
      type: string
      enum: [ok, nearing_limit, blocked]
    RunStatus:
      type: string
      enum: [queued, running, completed, failed, canceled, cancel_requested]
    Actor:
      type: object
      additionalProperties: false
      required: [workosUserId, email, displayName]
      properties:
        workosUserId:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
    Entitlement:
      type: object
      additionalProperties: false
      required: [key, granted]
      properties:
        key:
          type: string
        granted:
          type: boolean
        reason:
          type: string
    UsageSummary:
      type: object
      additionalProperties: false
      required:
        [organizationId, periodStart, periodEnd, runsUsed, tokensUsed, enforcementState]
      properties:
        organizationId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        runsUsed:
          type: integer
          minimum: 0
        runsLimit:
          type:
            - integer
            - 'null'
          minimum: 0
        tokensUsed:
          type: integer
          minimum: 0
        tokensLimit:
          type:
            - integer
            - 'null'
          minimum: 0
        enforcementState:
          $ref: '#/components/schemas/UsageEnforcementState'
        updatedAt:
          type: string
          format: date-time
    BillingSummary:
      type: object
      additionalProperties: false
      required: [organizationId, provider, state, entitlements]
      properties:
        organizationId:
          type: string
          format: uuid
        provider:
          type: string
          enum: [polar]
        state:
          $ref: '#/components/schemas/BillingState'
        planKey:
          type:
            - string
            - 'null'
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        sourceEventId:
          type:
            - string
            - 'null'
        lastProjectedAt:
          type:
            - string
            - 'null'
          format: date-time
    Organization:
      type: object
      additionalProperties: false
      required:
        [id, workosOrganizationId, slug, displayName, role, billing, usage, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        workosOrganizationId:
          type: string
        slug:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        billing:
          $ref: '#/components/schemas/BillingSummary'
        usage:
          $ref: '#/components/schemas/UsageSummary'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrganizationDetail:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          additionalProperties: false
          properties:
            metadata:
              type: object
              additionalProperties: true
    SessionBootstrap:
      type: object
      additionalProperties: false
      required: [actor, organizations]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
        selectedOrganizationId:
          type:
            - string
            - 'null'
          format: uuid
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
    OrganizationListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [displayName, slug]
      properties:
        displayName:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
    RunLogEntry:
      type: object
      additionalProperties: false
      required: [index, level, message, timestamp]
      properties:
        index:
          type: integer
          minimum: 0
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    RunArtifact:
      type: object
      additionalProperties: false
      required: [id, kind, name, contentType, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        name:
          type: string
        contentType:
          type: string
        url:
          type:
            - string
            - 'null'
          format: uri
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    Run:
      type: object
      additionalProperties: false
      required:
        [id, organizationId, requestedByWorkosUserId, kind, status, logCount, artifactCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        requestedByWorkosUserId:
          type: string
        kind:
          type: string
        idempotencyKey:
          type:
            - string
            - 'null'
        status:
          $ref: '#/components/schemas/RunStatus'
        logCount:
          type: integer
          minimum: 0
        artifactCount:
          type: integer
          minimum: 0
        cancelRequestedAt:
          type:
            - string
            - 'null'
          format: date-time
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
        completedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RunDetail:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          additionalProperties: false
          required: [input, logs, artifacts]
          properties:
            input:
              type: object
              additionalProperties: true
            logs:
              type: array
              items:
                $ref: '#/components/schemas/RunLogEntry'
            artifacts:
              type: array
              items:
                $ref: '#/components/schemas/RunArtifact'
    RunListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        nextCursor:
          type:
            - string
            - 'null'
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [kind, input]
      properties:
        kind:
          type: string
          minLength: 1
        input:
          type: object
          additionalProperties: true
        idempotencyKey:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
