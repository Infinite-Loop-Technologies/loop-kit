name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        required: true
        type: boolean
        default: true
      skip_checks:
        description: 'Skip Moon verification before publish'
        required: true
        type: boolean
        default: false
      tag:
        description: 'npm dist-tag'
        required: true
        type: string
        default: latest

jobs:
  publish-cli:
    name: Publish CLI stack
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Proto and toolchain cache
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install workspace dependencies
        run: proto run pnpm -- install --frozen-lockfile

      - name: Publish CLI stack
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          args=()

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=("--dry-run")
          fi

          if [ "${{ inputs.skip_checks }}" = "true" ]; then
            args+=("--skip-checks")
          fi

          if [ -n "${{ inputs.tag }}" ]; then
            args+=("--tag" "${{ inputs.tag }}")
          fi

          node tools/release/publish-loop-cli-stack.mjs "${args[@]}"
