name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  bun-ci:
    name: Bun CI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Proto and toolchain cache
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run repo CI
        run: bun run ci
